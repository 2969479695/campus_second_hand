<div style="padding:20px; border:1px solid #dce5ec; border-radius:14px; max-width:560px; margin:0 auto; background:#fff; box-shadow:0 12px 30px rgba(15,33,52,.15);">
  <h3 style="margin-bottom:10px; color:#0c5f4e;">订单支付</h3>
    <p><strong>订单号：</strong> {{ order.order_no }}</p>
    <p><strong>商品：</strong> {{ order.goods }}</p>
    <p><strong>金额：</strong> ¥{{ order.amount }}</p>
    <p><strong>当前支付状态：</strong> {{ order.get_pay_status_display }}</p>

    <form id="payFragmentForm" method="post" action="{% url 'core:order_pay' %}" style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
      {% csrf_token %}
      <input type="hidden" id="fragment_order_id" name="order_id" value="{{ order.order_no }}">
      <button id="fragmentPayBtn" type="button" class="btn" style="width:auto;">确认支付</button>
      <a href="{% url 'core:order_list' %}" class="btn btn-link" style="width:auto;">查看订单列表</a>
    </form>
</div>
