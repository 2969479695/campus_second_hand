{% extends 'core/base.html' %}

{% block title %}取消订单{% endblock %}

{% block content %}
<div style="max-width:640px; margin:30px auto;">
    <div style="background:#fff; border:1px solid #dce5ec; border-radius:14px; padding:18px;">
        <h3 style="margin-bottom:10px; color:#0c5f4e;">取消订单确认</h3>
        <p style="color:#64748b; margin-bottom:10px;">确认后订单将被取消，库存会自动回补。</p>

        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; margin-bottom:12px; color:#334155;">
            <p><strong>订单号：</strong>{{ order.order_no }}</p>
            <p><strong>商品：</strong>{{ order.goods.title }}</p>
            <p><strong>金额：</strong>¥{{ order.amount }}</p>
            <p><strong>状态：</strong>{{ order.get_order_status_display }}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="cancel_reason">取消原因（可选）</label>
                <textarea class="form-control" id="cancel_reason" name="cancel_reason" rows="3" placeholder="请说明取消原因"></textarea>
            </div>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button type="submit" class="btn btn-danger" style="width:auto;">确认取消</button>
                <a href="{% url 'core:order_list' %}" class="btn btn-secondary" style="width:auto;">返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
